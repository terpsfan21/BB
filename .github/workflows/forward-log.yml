name: forward-log-odds

# Hourly sportsbook snapshot for the forward test of the frozen v1 model.
# Logs new/changed totals and prices (data/forward/lines.csv), a heartbeat per poll (polls.csv) and
# the best available number for games the frozen rule flags (opportunities.csv).
#
# The prediction step is NOT run here: barttorvik.com returns 403 to GitHub-hosted runners, so
# signals are logged by a separate scheduled job that can reach Torvik (see docs/FORWARD_TEST.md).
# Scheduled runs can start several minutes late; every row carries its own UTC timestamp.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-log
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy
      - name: Snapshot odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS }}
        run: python src/forward_log.py odds
      - name: Commit logs
        run: |
          git config user.name "forward-log"
          git config user.email "forward-log@users.noreply.github.com"
          git add data/forward
          git diff --cached --quiet && exit 0
          git commit -q -m "odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
